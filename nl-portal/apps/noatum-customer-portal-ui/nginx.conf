# One origin for the browser: the SPA and /api share a host, so the portal session
# cookie (ADR-006) stays first-party and no CORS is involved. The API is a sidecar
# container in the same App Service and listens on localhost:3000.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # The API accepts uploads up to 20 MB; leave room for multipart overhead.
    client_max_body_size 25m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # No add_header here: the API sets its own security and cache headers.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Instant rates wait up to 25 s on the rate engine (PRD section 7).
        proxy_read_timeout 60s;
    }

    # add_header is not inherited once a location declares its own, so each static
    # location repeats the security headers.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Deep links fall back to the SPA. index.html is never cached, or a deployment
    # leaves browsers on the previous build.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # SAMEORIGIN, not DENY: MSAL renews tokens in a hidden iframe on this origin.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
