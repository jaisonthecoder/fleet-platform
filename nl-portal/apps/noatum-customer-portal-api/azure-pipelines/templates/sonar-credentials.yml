# Hands the SonarQube-Stg service connection to stages/sonarqube-scan-v2.yml,
# which expects SONAR_HOST_URL and SONAR_TOKEN as variables.
#
# WHY this indirection: a service connection's credential can only be read by
# a task built for it. SonarQubePrepare resolves the connection and passes the
# credential to the scanner in SONARQUBE_SCANNER_PARAMS; this lifts the host
# and token out of that JSON (the token as a SECRET variable, so it stays
# masked) and then empties the JSON, so the npm scanner does not also pick up
# branch properties that the Community Edition server rejects. The token never
# appears in this repository or in a variable group.

parameters:
  - name: projectKey
    type: string

steps:
  - task: SonarQubePrepare@6
    displayName: 'Resolve the SonarQube-Stg connection'
    inputs:
      SonarQube: 'SonarQube-Stg'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: '${{ parameters.projectKey }}'

  - bash: |
      set -euo pipefail
      node <<'NODE'
      let params = {};
      try {
        params = JSON.parse(process.env.QR_SCANNER_PARAMS || '{}');
      } catch {
        params = {};
      }
      const host = params['sonar.host.url'];
      const token = params['sonar.token'] || params['sonar.login'];
      if (params['sonar.password']) {
        console.log('##vso[task.logissue type=error]SonarQube-Stg holds a username and password, not a token; the scanner and the report export need a token.');
        process.exit(1);
      }
      if (!host || !token) {
        const keys = Object.keys(params).join(', ') || 'none';
        console.log(`##vso[task.logissue type=error]SonarQubePrepare exposed no host and token (keys present: ${keys}).`);
        process.exit(1);
      }
      console.log(`##vso[task.setvariable variable=SONAR_TOKEN;issecret=true]${token}`);
      console.log(`##vso[task.setvariable variable=SONAR_HOST_URL]${host}`);
      console.log('##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]{}');
      console.log(`SonarQube host: ${host}`);
      NODE
    displayName: 'Hand the connection to the scanner'
    env:
      QR_SCANNER_PARAMS: $(SONARQUBE_SCANNER_PARAMS)
