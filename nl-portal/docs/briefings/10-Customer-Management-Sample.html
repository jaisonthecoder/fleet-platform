<html lang="en">

<style>
:root{--red:#AA272F;--red-dark:#8E2027;--red-soft:#F7ECEC;--navy:#002C5F;--ink:#333333;--body:#58595B;--line:#E5E5E5;--surface:#F5F5F3;--white:#FFFFFF;--green:#24623C;--green-soft:#EDF5EF;--amber:#805400;--amber-soft:#FFF5DF;--font:'Mulish','Segoe UI',sans-serif;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--radius:4px}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.55 var(--font);letter-spacing:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--red)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--navy);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:28px;line-height:1.25;margin-bottom:12px;font-weight:800}h1:after{content:'';display:block;background:var(--red);width:40px;height:3px;margin-top:16px}h2{font-size:19px;margin-bottom:20px}h3{font-size:16px;margin-bottom:12px}small,.muted{color:var(--body)}small{font-size:12px}input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;padding:11px 12px;border:1px solid #B9B9B9;background:var(--white);color:var(--ink);border-radius:var(--radius);min-height:44px}input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--red);flex-shrink:0}textarea{resize:vertical;min-height:90px}label{font-weight:700;display:block;margin-bottom:7px}label small{font-weight:400}input[readonly]{background:var(--surface)!important}button.primary,.button{background:var(--red);border:1px solid var(--red);border-radius:var(--radius);padding:11px 18px;color:var(--white);font-weight:700;min-height:44px}button.primary:hover{background:var(--red-dark)}button.secondary{background:var(--white);border:1px solid var(--red);color:var(--red);border-radius:var(--radius);padding:10px 16px;min-height:44px;font-weight:700}.link{border:0;background:none;color:var(--red);padding:8px 0;text-align:left;font-weight:700;text-decoration:underline;text-underline-offset:3px}.icon-button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--white);border-radius:var(--radius);font-size:24px}.utility{background:var(--navy);color:var(--white);padding:7px 28px;display:flex;justify-content:space-between;font-size:12px;gap:16px}.utility span{overflow-wrap:anywhere}.header{height:78px;background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);gap:20px}.wordmark{color:var(--navy);font-size:24px;font-weight:800;line-height:1}.wordmark small{color:var(--navy);font-size:10px;font-weight:700;display:block;margin-top:7px}.header-context{display:flex;gap:24px;align-items:center}.header-context span:first-child{border-bottom:2px solid var(--red);padding:28px 0;color:var(--red);font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--white);font-weight:700}.identity{display:flex;align-items:center;gap:10px}.identity small{display:block}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 110px)}aside{background:var(--white);border-right:1px solid var(--line);padding:28px 12px}aside .eyebrow{margin:0 14px 12px;color:var(--body);font-size:11px;font-weight:800;text-transform:uppercase}aside .eyebrow.platform{margin-top:36px}.nav-button{width:100%;border:0;border-left:3px solid transparent;background:none;padding:12px 14px;text-align:left;color:var(--body);margin-bottom:5px;min-height:44px}.nav-button.active{border-left-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:800}.nav-button:hover{background:var(--surface)}main{padding:36px 40px 50px;min-width:0;max-width:1600px;width:100%;margin:auto;align-self:start}.heading{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:25px}.heading p{color:var(--body);margin-bottom:0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.crumb{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-size:13px;flex-wrap:wrap}.crumb button{font-size:13px}.panel{background:var(--white);border-top:1px solid var(--line);padding:24px;margin-bottom:24px}.panel.table-panel{padding:0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--white)}.toolbar .field{min-width:150px;flex:1}.toolbar .field.search{flex:3;min-width:200px}.toolbar label{font-size:12px}.filters,.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow:auto;background:var(--white)}.filters button,.tabs button{white-space:nowrap;background:transparent;border:0;border-bottom:3px solid transparent;padding:16px 20px;color:var(--body);font-weight:700;min-height:48px}.filters button.active,.tabs button.active{color:var(--red);border-bottom-color:var(--red)}.count{font-size:11px;background:var(--surface);padding:3px 7px;margin-left:7px;color:var(--body)}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;text-transform:uppercase;background:var(--white);color:var(--body);font-weight:800;padding:15px 20px;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:20px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:95px}td strong{display:block}td .link{padding:0}td small{display:block;margin-top:4px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#FAFAF9}.badge{display:inline-block;font-size:11px;line-height:1.6;font-weight:800;padding:4px 9px;white-space:nowrap;background:var(--surface);color:var(--body);border-radius:2px}.badge.active,.badge.accepted,.badge.linked{background:var(--green-soft);color:var(--green)}.badge.onboarding,.badge.invited,.badge.pending{background:var(--amber-soft);color:var(--amber)}.badge.suspended,.badge.revoked{background:var(--red-soft);color:var(--red)}.table-footer{padding:16px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--body)}.empty{text-align:center;padding:56px 20px;color:var(--body)}.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{min-width:0}.full{grid-column:1/-1}.summary-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 32px;margin:0}.summary-list dt{color:var(--body);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:7px}.summary-list dd{margin:0;overflow-wrap:anywhere;font-weight:600}.summary-list dd small{display:block;font-weight:400}.section-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.section-head h2{margin:0}.note{background:var(--surface);border-left:3px solid var(--navy);padding:14px 18px;margin:20px 0;color:var(--body);font-size:13px}.checks{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.checkline{display:flex;gap:10px;align-items:start;font-weight:500}.checkline input{margin-top:2px}.steps{display:flex;list-style:none;padding:0;margin:0 0 26px;gap:0;background:var(--white);border:1px solid var(--line)}.steps li{flex:1;padding:16px 14px;border-bottom:3px solid transparent;display:flex;gap:10px;align-items:center;color:var(--body);font-weight:700;font-size:12px}.steps li.current{border-bottom-color:var(--red);color:var(--red)}.step-number{height:25px;width:25px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:12px}.current .step-number{background:var(--red);color:var(--white);border-color:var(--red)}.wizard{max-width:1040px;margin:0 auto}.wizard-footer{display:flex;justify-content:space-between;gap:16px;padding:20px 0}.error{color:var(--red);background:var(--red-soft);padding:12px 16px;margin-bottom:18px;font-weight:700}.org-choice{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);font-weight:400}.org-choice strong{display:block}.org-choice small{display:block}.org-choice .choice-meta{margin-left:auto;font-size:12px;color:var(--body)}.review-block{padding:22px 0;border-bottom:1px solid var(--line)}.review-block:first-child{padding-top:0}.review-block h3{display:flex;justify-content:space-between}.review-block h3 button{font-size:12px}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:155px minmax(0,1fr);gap:20px}.timeline small{display:block}.policy-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}.policy-row span:last-child{color:var(--body);font-size:13px}.branch-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.branch{padding:24px;border:1px solid var(--line);background:var(--white)}.branch h3{color:var(--navy);font-size:18px}.branch dl{grid-template-columns:1fr 1fr}.branch .badge{margin-bottom:20px}.toast{position:fixed;bottom:24px;right:24px;max-width:min(460px,calc(100vw - 48px));padding:16px 22px;background:var(--navy);color:var(--white);z-index:10;box-shadow:0 5px 18px #0002}.toast:empty{display:none}dialog{border:0;border-top:4px solid var(--red);padding:28px;max-width:560px;width:calc(100% - 32px);max-height:90vh;overflow:auto;color:var(--ink);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#00132666}dialog header{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px;align-items:center}dialog header h2{margin:0}dialog .actions{justify-content:end;margin-top:24px}dialog .field{margin-bottom:18px}.sample-tag{border:1px solid #FFFFFF70;padding:1px 7px;white-space:nowrap}.menu-toggle{display:none}.footnote{color:var(--body);font-size:11px;margin-top:32px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:20px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.settings-grid .checkline{padding:16px;border:1px solid var(--line)}.address-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.address{border-left:3px solid var(--line);padding:4px 20px;overflow-wrap:anywhere}.address p{margin:12px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1450px){main{padding:42px 50px}}@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:28px 24px}.header-context{display:none}.summary-list{grid-template-columns:repeat(2,minmax(0,1fr))}.steps li{padding:14px 8px;flex-direction:column;align-items:start}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:720px){.utility{padding:7px 16px}.utility .workspace{display:none}.header{height:70px;padding:0 16px}.wordmark{font-size:20px}.identity .identity-text{display:none}.menu-toggle{display:inline-flex}.layout{display:block}.layout aside{display:none;border-bottom:1px solid var(--line)}.layout aside.open{display:block}.nav-button{padding:10px 14px}main{padding:24px 16px}.heading{flex-direction:column;gap:18px}h1{font-size:24px}.heading .actions{width:100%}.heading .primary{width:100%}.panel{padding:20px 16px}.grid,.grid.three,.summary-list,.branch-list,.address-grid,.settings-grid{grid-template-columns:1fr}.toolbar{padding:16px}.toolbar .field{min-width:100%}.steps{overflow-x:auto}.steps li{min-width:95px;font-size:11px}.wizard-footer .primary{max-width:70%}.policy-row{grid-template-columns:1fr;gap:5px}.timeline li{grid-template-columns:1fr;gap:6px}.tabs button{padding:14px}.footnote{flex-direction:column;gap:5px}.review-block h3{align-items:center}.section-head{align-items:start;flex-wrap:wrap}td,th{padding:16px}.checkline{line-height:1.6}.org-choice{flex-wrap:wrap}.org-choice .choice-meta{margin-left:32px}.table-scroll{max-width:100%}}
</style>
</head>
<body>
<div class="utility"><span>Internal workspace <span class="workspace">/ Noatum Logistics Valencia</span></span><span class="sample-tag">Sample data only</span></div>
<header class="header"><div class="actions"><button class="icon-button menu-toggle" id="menu" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button><div class="wordmark">NOATUM<small>LOGISTICS</small></div></div><div class="header-context"><span>Customer Success</span><span>Customer administration</span></div><div class="identity"><span class="avatar">DN</span><div class="identity-text">Diego Navarro<small>Portal administrator</small></div></div></header>
<div class="layout"><aside id="sidebar" aria-label="Main navigation"><p class="eyebrow">Customer Success</p><nav><button class="nav-button" data-nav="customers">Customers</button><button class="nav-button" data-nav="organisations">CW1 organisations</button><button class="nav-button" data-nav="invitations">Invitations</button></nav><p class="eyebrow platform">Platform</p><nav><button class="nav-button" data-nav="branches">Operating structure</button></nav></aside><main id="app" tabindex="-1"></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<script>
'use strict';
const branches=[{id:'valencia',name:'Valencia',code:'ESVLC',country:'Spain',city:'Valencia',region:'Europe',company:'Noatum Logistics Spain',address:'Valencia, Spain',zone:'Europe/Madrid'},{id:'barcelona',name:'Barcelona',code:'ESBCN',country:'Spain',city:'Barcelona',region:'Europe',company:'Noatum Logistics Spain',address:'Barcelona, Spain',zone:'Europe/Madrid'}];
const orgs=[
 {id:'org1',code:'IBERIARETVLC',name:'Iberia Retail Spain SL',country:'Spain',city:'Valencia',active:true,addresses:[{id:'ADDR-101',name:'Registered office',lines:'24 Calle del Comercio',city:'46001 Valencia',country:'Spain',primary:true},{id:'ADDR-102',name:'Distribution centre',lines:'18 Avenida del Puerto',city:'46024 Valencia',country:'Spain',primary:false}],contacts:[{name:'Laura Martin',role:'Logistics',email:'laura@iberia.example'}]},
 {id:'org2',code:'IBERIARETBCN',name:'Iberia Retail Barcelona SL',country:'Spain',city:'Barcelona',active:true,addresses:[{id:'ADDR-201',name:'Warehouse',lines:'42 Carrer del Transport',city:'08040 Barcelona',country:'Spain',primary:true}],contacts:[]},
 {id:'org3',code:'LEVANTEFOOD',name:'Levante Foods SA',country:'Spain',city:'Valencia',active:true,addresses:[{id:'ADDR-301',name:'Registered office',lines:'12 Calle de la Industria',city:'46022 Valencia',country:'Spain',primary:true},{id:'ADDR-302',name:'Cold storage',lines:'8 Camino del Almacen',city:'46980 Paterna',country:'Spain',primary:false}],contacts:[{name:'Marta Soler',role:'Supply chain',email:'marta@levante.example'}]},
 {id:'org4',code:'TEXTILALCOY',name:'Textil Alcoy SL',country:'Spain',city:'Alcoy',active:true,addresses:[{id:'ADDR-401',name:'Factory',lines:'15 Carrer del Teixit',city:'03801 Alcoy',country:'Spain',primary:true}],contacts:[]},
 {id:'org5',code:'CERAMTURIA',name:'Ceramicas del Turia SL',country:'Spain',city:'Valencia',active:false,addresses:[{id:'ADDR-501',name:'Registered office',lines:'6 Calle de la Ceramica',city:'46940 Manises',country:'Spain',primary:true}],contacts:[]}
];
let customers=[{id:'cust1',name:'Iberia Retail Group',country:'Spain',tier:'Large',domains:'iberia.example',locale:'English',status:'Active',links:[{org:'org1',office:'Valencia office',branch:'valencia',reason:'Verified customer relationship'},{org:'org2',office:'Barcelona office',branch:'barcelona',reason:'Verified customer relationship'}],users:[{id:'usr1',name:'Laura Martin',email:'laura@iberia.example',role:'Customer Admin',office:'All authorised offices',status:'Active'},{id:'usr2',name:'Carlos Ruiz',email:'carlos@iberia.example',role:'Finance',office:'Valencia office',status:'Active'}],policy:'CW1-confirmed',audit:[{action:'Customer activated',detail:'Customer Admin accepted; two organisations linked',time:'10.09.2026, 09:00'}]}];
const state={view:'customers',customer:'cust1',org:null,tab:'Overview',orgTab:'Overview',query:'',status:'All',step:0,draft:null,returnView:'customers'};
const app=document.querySelector('#app');
const modal=document.querySelector('#modal');
const esc=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const badge=value=>`<span class="badge ${esc(value.toLowerCase().replace(/\s/g,'-'))}">${esc(value)}</span>`;
const selected=(first,second)=>first===second?' selected':'';
const getCustomer=()=>customers.find(customer=>customer.id===state.customer);
const getOrg=orgId=>orgs.find(org=>org.id===orgId);
const getBranch=branchId=>branches.find(branch=>branch.id===branchId);
const owner=orgId=>customers.find(customer=>customer.links.some(link=>link.org===orgId));
function notify(message){document.querySelector('#toast').textContent=message;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{document.querySelector('#toast').textContent='';},5000);}
function audit(customer,action,detail){customer.audit.unshift({action,detail,time:new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date()).replaceAll('/','.')});}
function footer(){return '<footer class="footnote"><span>Noatum Logistics / AD Ports Group</span><span>Design sample / In-memory changes / No live integrations</span></footer>';}
function heading(title,subtitle,action=''){return `<div class="heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`;}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function selectField(label,name,options,value){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${options.map(option=>{const optionValue=typeof option==='string'?option:option.value;return `<option value="${esc(optionValue)}"${selected(optionValue,value)}>${esc(typeof option==='string'?option:option.label)}</option>`;}).join('')}</select></div>`;}
function empty(title,detail){return `<div class="empty"><strong>${esc(title)}</strong>${esc(detail)}</div>`;}
function table(headers,rows){return `<div class="table-scroll"><table><thead><tr>${headers.map(header=>`<th scope="col">${header}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;}
function navigate(view){if(state.view==='wizard'&&!confirm('Discard this unfinished onboarding?'))return;state.view=view;state.query='';state.status='All';state.tab='Overview';document.querySelector('#sidebar').classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false');render();app.focus();}
function openCustomer(customerId){state.customer=customerId;state.view='detail';state.tab='Overview';render();app.focus();}
function openOrg(orgId){state.org=orgId;state.view='org';state.orgTab='Overview';render();app.focus();}
function render(){document.querySelectorAll('[data-nav]').forEach(button=>{const active=button.dataset.nav===state.view||(button.dataset.nav==='customers'&&['detail','wizard'].includes(state.view))||(button.dataset.nav==='organisations'&&state.view==='org');button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});const views={customers:renderCustomers,organisations:renderOrganisations,org:renderOrg,detail:renderDetail,wizard:renderWizard,invitations:renderInvitations,branches:renderBranches};app.innerHTML=views[state.view]()+footer();}
function renderCustomers(){return heading('Customers','Portal customer groups and their linked organisations.','<button class="primary" data-action="onboard">Onboard customer</button>')+`<section class="panel table-panel"><div class="filters" aria-label="Customer status">${['All','Active','Onboarding','Suspended'].map(status=>`<button data-status="${status}" class="${state.status===status?'active':''}" aria-pressed="${state.status===status}">${status}<span class="count">${customers.filter(customer=>status==='All'||customer.status===status).length}</span></button>`).join('')}</div><div class="toolbar"><div class="field search"><label for="customer-search">Search customers</label><input id="customer-search" data-search="customers" placeholder="Customer name, domain or organisation code" value="${esc(state.query)}"></div></div><div id="results">${customerRows()}</div></section>`;}
function customerRows(){const rows=customers.filter(customer=>(state.status==='All'||customer.status===state.status)&&[customer.name,customer.domains,...customer.links.map(link=>getOrg(link.org).code)].join(' ').toLowerCase().includes(state.query.toLowerCase()));return rows.length?table(['Customer','Linked organisations','Servicing','Users','First admin','Status'],rows.map(customer=>`<tr><td><button class="link" data-customer="${customer.id}">${esc(customer.name)}</button><small>${customer.country} / ${customer.tier}</small></td><td>${customer.links.length} organisations</td><td>${[...new Set(customer.links.map(link=>getBranch(link.branch).name))].join(', ')}</td><td>${customer.users.length}</td><td>${badge(customer.users.some(user=>user.role==='Customer Admin'&&user.status==='Active')?'Accepted':'Invited')}</td><td>${badge(customer.status)}</td></tr>`).join(''))+`<div class="table-footer">${rows.length} customer${rows.length===1?'':'s'}</div>`:empty('No matching customers','Adjust your search or status filter.');}
function renderOrganisations(){return heading('CW1 organisations','Source directory / Last sample import: 11.09.2026, 06:00 UTC')+`<section class="panel table-panel"><div class="toolbar"><div class="field search"><label for="org-search">Search source directory</label><input id="org-search" data-search="organisations" value="${esc(state.query)}" placeholder="Organisation code, name or city"></div><div class="field"><label for="link-filter">Portal link</label><select id="link-filter" data-filter="org"><option${selected(state.status,'All')}>All</option><option${selected(state.status,'Linked')}>Linked</option><option${selected(state.status,'Not linked')}>Not linked</option></select></div></div><div id="results">${orgRows()}</div></section>`;}
function orgRows(){const rows=orgs.filter(org=>[org.code,org.name,org.city].join(' ').toLowerCase().includes(state.query.toLowerCase())&&(state.status==='All'||(state.status==='Linked'?!!owner(org.id):!owner(org.id))));return rows.length?table(['Organisation / source','Location','CW1 status','Portal customer',''],rows.map(org=>`<tr><td><button class="link" data-org="${org.id}">${esc(org.name)}</button><small>${org.code} / CW1 sample</small></td><td>${org.city}<small>${org.country}</small></td><td>${badge(org.active?'Active':'Inactive')}</td><td>${owner(org.id)?esc(owner(org.id).name):'<span class="muted">Not linked</span>'}</td><td><button class="link" data-org="${org.id}">View</button></td></tr>`).join(''))+`<div class="table-footer">${rows.length} organisations</div>`:empty('No matching organisations','Clear the filter or search another organisation.');}
function renderOrg(){const org=getOrg(state.org);const customer=owner(org.id);const tabs=['Overview','Addresses','Contacts'];let content='';if(state.orgTab==='Overview')content=`<dl class="summary-list"><div><dt>Organisation code</dt><dd>${org.code}</dd></div><div><dt>Source</dt><dd>CW1 sample</dd></div><div><dt>CW1 status</dt><dd>${badge(org.active?'Active':'Inactive')}</dd></div><div><dt>Country / city</dt><dd>${org.country} / ${org.city}</dd></div><div><dt>Addresses</dt><dd>${org.addresses.length} source locations</dd></div><div><dt>Last successful sync</dt><dd>11.09.2026, 06:00 UTC</dd></div></dl><div class="note">CW1 master data / Read-only</div><div class="section-head"><div><h3>Portal link</h3><span class="muted">${customer?esc(customer.name):'Not linked to a customer'}</span></div>${customer?`<button class="secondary" data-customer="${customer.id}">Open customer</button>`:org.active?`<button class="secondary" data-action="link-existing" data-org-id="${org.id}">Link to existing customer</button>`:''}</div>`;
if(state.orgTab==='Addresses')content=`<div class="address-grid">${org.addresses.map(address=>`<article class="address"><h3>${esc(address.name)}</h3>${address.primary?badge('Primary'):''}<p>${esc(address.lines)}<br>${esc(address.city)}<br>${esc(address.country)}</p><small>${address.id} / CW1 source / Read-only</small></article>`).join('')}</div>`;
if(state.orgTab==='Contacts')content=org.contacts.length?table(['Name','Function','Email'],org.contacts.map(contact=>`<tr><td>${contact.name}</td><td>${contact.role}</td><td>${contact.email}</td></tr>`).join('')):empty('No contacts supplied','The sample source record contains no contact entries.');
return `<div class="crumb"><button class="link" data-nav="organisations">CW1 organisations</button><span>/ ${esc(org.code)}</span></div>`+heading(org.name,`${org.city}, ${org.country}`,!customer&&org.active?`<button class="primary" data-action="onboard" data-org-id="${org.id}">Onboard customer</button>`:'')+`<div class="tabs">${tabs.map(tab=>`<button data-org-tab="${tab}" class="${state.orgTab===tab?'active':''}" aria-pressed="${state.orgTab===tab}">${tab}${tab==='Addresses'?` <span class="count">${org.addresses.length}</span>`:''}</button>`).join('')}</div><section class="panel">${content}</section>`;}
function startOnboard(orgId){const org=orgId?getOrg(orgId):null;state.returnView=state.view;state.draft={name:org?.name||'',country:'Spain',tier:'SME',domains:'',locale:'English',links:org?[{org:org.id,office:org.city+' office',branch:'valencia'}]:[],reason:'',admin:'',email:''};state.step=0;state.view='wizard';render();app.focus();}
function captureWizard(){const form=document.querySelector('#wizard-form');if(!form)return;const data=new FormData(form);const draft=state.draft;if(state.step===0){['name','country','tier','domains','locale'].forEach(key=>draft[key]=String(data.get(key)||'').trim());}if(state.step===1){draft.reason=String(data.get('reason')||'').trim();draft.links=data.getAll('org').map(orgId=>draft.links.find(link=>link.org===orgId)||{org:orgId,office:getOrg(orgId).city+' office',branch:'valencia'});}if(state.step===2){draft.links.forEach(link=>{link.office=String(data.get('office-'+link.org)||'').trim();link.branch=String(data.get('branch-'+link.org)||'');});}if(state.step===3){draft.admin=String(data.get('admin')||'').trim();draft.email=String(data.get('email')||'').trim();}}
function wizardError(message){const error=document.querySelector('#wizard-error');error.textContent=message;error.hidden=false;error.focus();}
function validateWizard(){const form=document.querySelector('#wizard-form');if(!form.reportValidity())return false;captureWizard();const draft=state.draft;if(state.step===0){const domains=draft.domains.split(',').map(domain=>domain.trim().toLowerCase());if(!domains.every(domain=>/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i.test(domain))){wizardError('Enter company domains separated by commas, without @ or https://.');return false;}draft.domains=domains.join(', ');}if(state.step===1&&!draft.links.length){wizardError('Select at least one unlinked organisation.');return false;}if(state.step===3&&!draft.domains.split(',').map(domain=>domain.trim().toLowerCase()).includes(draft.email.split('@')[1]?.toLowerCase())){wizardError('The first admin email must match one of the customer company domains.');return false;}return true;}
function renderWizard(){const draft=state.draft;const steps=['Customer details','Organisations','Servicing','First admin','Review'];let body='';if(state.step===0)body=`<h2>Customer details</h2><div class="grid">${field('Customer display name *','name',draft.name,'text','required maxlength="120"')}${selectField('Country *','country',['Spain','France','United States'],draft.country)}${selectField('Customer tier *','tier',['SME','Large'],draft.tier)}${selectField('Default locale *','locale',['English','Spanish'],draft.locale)}<div class="full">${field('Company email domains *','domains',draft.domains,'text','required placeholder="company.example, subsidiary.example" maxlength="250"')}</div></div>`;
if(state.step===1)body=`<h2>Link CW1 organisations</h2>${orgs.map(org=>{const linked=owner(org.id);return `<label class="org-choice"><input type="checkbox" name="org" value="${org.id}" ${draft.links.some(link=>link.org===org.id)?'checked':''} ${linked||!org.active?'disabled':''}><span><strong>${esc(org.name)}</strong><small>${org.code} / ${org.city}, ${org.country}</small></span><span class="choice-meta">${linked?'Linked to '+esc(linked.name):!org.active?'Source inactive':org.addresses.length+' source addresses'}</span></label>`;}).join('')}<div style="margin-top:24px"><label for="reason">Link justification *</label><textarea id="reason" name="reason" required maxlength="500" placeholder="Customer relationship verified with the account owner">${esc(draft.reason)}</textarea></div>`;
if(state.step===2)body=`<h2>Office labels and Noatum servicing</h2>${draft.links.map(link=>`<div class="review-block"><h3>${esc(getOrg(link.org).name)}</h3><div class="grid">${field('Customer office label *','office-'+link.org,link.office,'text','required maxlength="100"')}${selectField('Noatum servicing branch *','branch-'+link.org,branches.map(branch=>({value:branch.id,label:branch.name+' / '+branch.code})),link.branch)}</div></div>`).join('')}<div class="note">Sample branch policy: CW1-confirmed publication / Internal pricing approval required. Region is a grouping label in this sample.</div>`;
if(state.step===3)body=`<h2>Invite the first Customer Admin</h2><div class="grid">${field('Display name *','admin',draft.admin,'text','required maxlength="100"')}${field('Company email *','email',draft.email,'email','required maxlength="150"')}<div><label>Role</label><p>${badge('Customer Admin')}</p></div><div><label>Invitation expiry</label><p>7 days / Sample configuration</p></div></div><div class="note">Allowed domains: ${esc(draft.domains)}</div>`;
if(state.step===4)body=`<h2>Review customer onboarding</h2><div class="review-block"><h3>Customer details <button type="button" class="link" data-step="0">Edit</button></h3><dl class="summary-list"><div><dt>Customer</dt><dd>${esc(draft.name)}</dd></div><div><dt>Country / tier</dt><dd>${draft.country} / ${draft.tier}</dd></div><div><dt>Domains</dt><dd>${esc(draft.domains)}</dd></div></dl></div><div class="review-block"><h3>Linked organisations <button type="button" class="link" data-step="1">Edit</button></h3>${draft.links.map(link=>`<p><strong>${esc(getOrg(link.org).name)}</strong><br><small>${getOrg(link.org).code} / ${esc(link.office)} / Noatum ${getBranch(link.branch).name}</small></p>`).join('')}<p class="muted">${esc(draft.reason)}</p></div><div class="review-block"><h3>First Customer Admin <button type="button" class="link" data-step="3">Edit</button></h3><p>${esc(draft.admin)} / ${esc(draft.email)}<br><small>${draft.locale} / Invitation expires in 7 days</small></p></div><div class="checks"><label class="checkline"><input type="checkbox" name="confirm" required>I confirm the customer relationship and organisation access.</label></div>`;
return `<div class="wizard">${heading('Onboard a customer',`Step ${state.step+1} of 5`, '<button class="secondary" data-action="cancel-wizard">Cancel</button>')}<ol class="steps">${steps.map((step,index)=>`<li class="${index===state.step?'current':''}" ${index===state.step?'aria-current="step"':''}><span class="step-number">${index+1}</span>${step}</li>`).join('')}</ol><form id="wizard-form"><div id="wizard-error" class="error" role="alert" tabindex="-1" hidden></div><section class="panel">${body}</section><div class="wizard-footer"><button type="button" class="secondary" data-action="back" ${state.step===0?'disabled':''}>Back</button><button class="primary" type="submit">${state.step===4?'Create sample customer':'Continue'}</button></div></form></div>`;}
function submitWizard(){if(!validateWizard())return;if(state.step<4){state.step++;render();app.focus();return;}const draft=state.draft;if(draft.links.some(link=>owner(link.org)||!getOrg(link.org).active)){wizardError('An organisation is no longer available. Review the selected links.');return;}const customer={id:'cust-'+Date.now(),name:draft.name,country:draft.country,tier:draft.tier,domains:draft.domains,locale:draft.locale,status:'Onboarding',links:draft.links.map(link=>({...link,reason:draft.reason})),users:[{id:'usr-'+Date.now(),name:draft.admin,email:draft.email,role:'Customer Admin',office:'All authorised offices',status:'Invited'}],policy:'CW1-confirmed',audit:[]};audit(customer,'Customer created','Organisations linked; sample first-admin invitation recorded. No email sent.');customers.push(customer);state.draft=null;openCustomer(customer.id);notify('Sample customer created. First-admin invitation recorded; no email sent.');}
function renderDetail(){const customer=getCustomer();const tabs=['Overview','Linked organisations','Users & invitations','Features & settings','Audit'];let content='';if(state.tab==='Overview'){const admin=customer.users.find(user=>user.role==='Customer Admin');content=`<dl class="summary-list"><div><dt>Customer country / tier</dt><dd>${customer.country} / ${customer.tier}</dd></div><div><dt>Company domains</dt><dd>${esc(customer.domains)}</dd></div><div><dt>Default locale</dt><dd>${customer.locale}</dd></div><div><dt>First Customer Admin</dt><dd>${esc(admin.name)}<small>${esc(admin.email)}</small></dd></div><div><dt>Admin acceptance</dt><dd>${badge(admin.status==='Active'?'Accepted':admin.status)}</dd></div><div><dt>Linked organisations</dt><dd>${customer.links.length} organisations</dd></div></dl><div class="checks"><span>${badge('Linked')} Organisation access</span><span>${badge(admin.status==='Active'?'Accepted':'Pending')} First admin</span><span class="muted">Source data: sample snapshot</span></div>${customer.status==='Onboarding'&&admin.status==='Invited'?`<div class="note">Awaiting first Customer Admin acceptance.</div><button class="secondary" data-action="sample-accept" data-user-id="${admin.id}">Record sample admin acceptance</button>`:''}`;}
if(state.tab==='Linked organisations')content=`<div class="section-head"><h2>Linked organisations</h2><button class="primary" data-action="link-org">Link organisation</button></div>${table(['Organisation','Office label','Noatum servicing branch','CW1 status',''],customer.links.map(link=>{const org=getOrg(link.org);return `<tr><td><strong>${esc(org.name)}</strong><small>${org.code}</small></td><td>${esc(link.office)}</td><td>${getBranch(link.branch).name}<small>${getBranch(link.branch).code}</small></td><td>${badge(org.active?'Active':'Inactive')}</td><td><button class="link" data-org="${org.id}">Source details</button></td></tr>`;}).join(''))}`;
if(state.tab==='Users & invitations')content=`<div class="section-head"><h2>Users and invitations</h2><button class="primary" data-action="invite">Invite Customer Admin</button></div>${table(['User','Role','Financial office','Status','Actions'],customer.users.map(user=>`<tr><td><strong>${esc(user.name)}</strong><small>${esc(user.email)}</small></td><td>${user.role}</td><td>${esc(user.office)}</td><td>${badge(user.status)}</td><td>${user.status==='Invited'?`<button class="link" data-action="resend" data-user-id="${user.id}">Resend</button> &nbsp; <button class="link" data-action="revoke" data-user-id="${user.id}">Revoke</button>`:user.status==='Active'?`<button class="link" data-action="deactivate" data-user-id="${user.id}">Deactivate</button>`:user.status==='Deactivated'?`<button class="link" data-action="reactivate" data-user-id="${user.id}">Reactivate</button>`:'<span class="muted">Revoked</span>'}</td></tr>`).join(''))}`;
if(state.tab==='Features & settings')content=`<div class="section-head"><h2>Effective quotation settings</h2><button class="secondary" data-action="policy">Review sample policy</button></div><div class="policy-row"><strong>Priced-offer publication</strong><span>${customer.policy}</span><span>${customer.policy==='CW1-confirmed'?'Branch default':'Customer sample override'}</span></div><div class="policy-row"><strong>Initial unpriced request sync</strong><span>Disabled</span><span>Sample branch default</span></div><div class="policy-row"><strong>Internal pricing approval</strong><span>Required</span><span>Sample branch default</span></div><div class="policy-row"><strong>Carrier disclosure</strong><span>Enabled</span><span>Sample customer policy</span></div><h2 style="margin-top:32px">Feature entitlements</h2>${table(['Feature','Customer entitlement','Delivery phase'],['Quotations','Tracking','Documents','Invoices','Bookings','Claims'].map((feature,index)=>`<tr><td>${feature}</td><td>${badge('Enabled')}</td><td>${index===0?'P1':index<4?'P2':'P3'}</td></tr>`).join(''))}<div class="note">Sample configuration only. Entitlements do not replace user permissions or enable unreleased workflows.</div>`;
if(state.tab==='Audit')content=`<h2>Customer audit</h2><ul class="timeline">${customer.audit.map(event=>`<li><small>${esc(event.time)}</small><div><strong>${esc(event.action)}</strong><small>${esc(event.detail)}</small></div></li>`).join('')}</ul>`;
return `<div class="crumb"><button class="link" data-nav="customers">Customers</button><span>/ ${esc(customer.name)}</span></div>`+heading(customer.name,`${customer.country} / ${customer.tier}`,`${badge(customer.status)}<button class="secondary" data-action="suspend">${customer.status==='Suspended'?'Reactivate customer':'Suspend customer'}</button>`)+`<div class="tabs" aria-label="Customer sections">${tabs.map(tab=>`<button data-tab="${tab}" class="${state.tab===tab?'active':''}" aria-pressed="${state.tab===tab}">${tab}</button>`).join('')}</div><section class="panel">${content}</section>`;}
function renderInvitations(){const invitations=customers.flatMap(customer=>customer.users.filter(user=>['Invited','Revoked'].includes(user.status)).map(user=>({customer,user})));return heading('Invitations','First Customer Admin invitations across portal customers.')+`<section class="panel table-panel">${invitations.length?table(['Customer','Invited user','Role','State',''],invitations.map(({customer,user})=>`<tr><td>${esc(customer.name)}</td><td><strong>${esc(user.name)}</strong><small>${esc(user.email)}</small></td><td>${user.role}</td><td>${badge(user.status)}</td><td><button class="link" data-customer="${customer.id}">Open customer</button></td></tr>`).join('')):empty('No pending invitations','Onboard a customer or invite a Customer Admin from a customer record.')}</section>`;}
function renderBranches(){return heading('Operating structure','Noatum servicing branches / Source-qualified sample catalogue')+`<div class="branch-list">${branches.map(branch=>`<article class="branch"><h3>${branch.name}</h3>${badge('Configured')}<dl class="summary-list"><div><dt>Branch code</dt><dd>${branch.code}</dd></div><div><dt>Region label</dt><dd>${branch.region}</dd></div><div><dt>Source company</dt><dd>${branch.company}</dd></div><div><dt>Country</dt><dd>${branch.country}</dd></div><div><dt>Timezone</dt><dd>${branch.zone}</dd></div><div><dt>Linked customer offices</dt><dd>${customers.flatMap(customer=>customer.links).filter(link=>link.branch===branch.id).length}</dd></div></dl></article>`).join('')}</div><div class="note">Region is a label here, not an access hierarchy. These sample branch assignments do not establish the final CW1 mapping or multi-branch routing rules.</div>`;}
function showModal(title,body,onSubmit){modal.innerHTML=`<header><h2 id="modal-title">${esc(title)}</h2><button class="icon-button" data-close aria-label="Close dialog">&times;</button></header><form id="modal-form">${body}<div id="modal-error" class="error" role="alert" hidden></div><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit" class="primary">Confirm</button></div></form>`;document.querySelector('#modal-form').addEventListener('submit',event=>{event.preventDefault();if(event.target.reportValidity())onSubmit(new FormData(event.target));});modal.showModal();}
function modalError(message){const error=document.querySelector('#modal-error');error.textContent=message;error.hidden=false;}
function closeModal(){modal.close();}
function linkModal(orgId){const customer=getCustomer();const eligible=orgs.filter(org=>org.active&&!owner(org.id));if(!eligible.length){notify('No unlinked active organisations are available.');return;}showModal('Link organisation',selectField('CW1 organisation *','org',eligible.map(org=>({value:org.id,label:org.name+' / '+org.code})),orgId||eligible[0].id)+field('Customer office label *','office','','text','required maxlength="100"')+selectField('Noatum servicing branch *','branch',branches.map(branch=>({value:branch.id,label:branch.name+' / '+branch.code})),'valencia')+'<label for="link-reason">Justification *</label><textarea id="link-reason" name="reason" required maxlength="500"></textarea><label class="checkline" style="margin-top:20px"><input type="checkbox" required>Confirm this organisation belongs to this customer.</label>',data=>{const org=data.get('org');if(owner(org)||!getOrg(org)?.active){modalError('This organisation is no longer eligible.');return;}customer.links.push({org,office:String(data.get('office')).trim(),branch:data.get('branch'),reason:String(data.get('reason')).trim()});audit(customer,'Organisation linked',getOrg(org).code+' / '+data.get('reason'));closeModal();state.view='detail';state.tab='Linked organisations';render();notify('Organisation linked in the sample.');});}
function inviteModal(){const customer=getCustomer();showModal('Invite Customer Admin',field('Display name *','invite-name','','text','required maxlength="100"')+field('Company email *','invite-email','','email','required maxlength="150"')+selectField('Locale *','invite-locale',['English','Spanish'],customer.locale)+`<p class="muted">Customer: ${esc(customer.name)}<br>Role: Customer Admin<br>Allowed domains: ${esc(customer.domains)}</p>`,data=>{const email=String(data.get('invite-email')).trim().toLowerCase();if(!customer.domains.split(',').map(domain=>domain.trim().toLowerCase()).includes(email.split('@')[1])){modalError('Email must match a registered customer domain.');return;}if(customer.users.some(user=>user.email.toLowerCase()===email&&user.status!=='Revoked')){modalError('This email already has a user or invitation.');return;}customer.users.push({id:'usr-'+Date.now(),name:String(data.get('invite-name')).trim(),email,role:'Customer Admin',office:'All authorised offices',status:'Invited'});audit(customer,'Sample invitation recorded',email+' / No email sent');closeModal();render();notify('Sample invitation recorded. No email sent.');});}
function reasonModal(title,impact,apply){showModal(title,`<p>${esc(impact)}</p><label for="action-reason">Reason *</label><textarea id="action-reason" name="reason" required maxlength="500"></textarea>`,data=>{apply(String(data.get('reason')).trim());closeModal();render();});}
function userAction(action,userId){const customer=getCustomer();const user=customer.users.find(entry=>entry.id===userId);if(!user)return;if(action==='sample-accept'){if(customer.status==='Suspended'||user.status!=='Invited'){notify('This sample invitation cannot be accepted.');return;}reasonModal('Record sample acceptance','This simulates the acceptance event only. No Microsoft sign-in or identity provisioning takes place.',reason=>{user.status='Active';if(customer.links.length)customer.status='Active';audit(customer,'Sample admin acceptance',reason+' / No authentication performed');notify('Sample customer activated.');});return;}if(action==='resend'){audit(customer,'Sample invitation resend',user.email+' / No email sent');render();notify('Sample resend recorded. No email sent.');return;}if(action==='deactivate'&&user.role==='Customer Admin'&&customer.users.filter(entry=>entry.role==='Customer Admin'&&entry.status==='Active').length<=1){notify('The last active Customer Admin cannot be deactivated.');return;}const next={revoke:'Revoked',deactivate:'Deactivated',reactivate:'Active'}[action];reasonModal(`${action[0].toUpperCase()+action.slice(1)} ${user.name}`,`Change portal access for ${user.email}.`,reason=>{user.status=next;audit(customer,'User access changed',user.email+' / '+next+' / '+reason);notify('Sample user access updated.');});}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.hasAttribute('data-close')){closeModal();return;}if(button.dataset.nav){navigate(button.dataset.nav);return;}if(button.dataset.customer){openCustomer(button.dataset.customer);return;}if(button.dataset.org){openOrg(button.dataset.org);return;}if(button.dataset.status){state.status=button.dataset.status;render();return;}if(button.dataset.tab){state.tab=button.dataset.tab;render();return;}if(button.dataset.orgTab){state.orgTab=button.dataset.orgTab;render();return;}if(button.dataset.step){captureWizard();state.step=Number(button.dataset.step);render();return;}const action=button.dataset.action;if(action==='onboard')startOnboard(button.dataset.orgId);if(action==='cancel-wizard'){if(confirm('Discard this unfinished onboarding?')){state.draft=null;state.view=state.returnView;render();}}if(action==='back'){captureWizard();state.step--;render();}if(action==='link-org')linkModal();if(action==='link-existing'){const eligible=customers.filter(customer=>customer.status!=='Suspended');if(!eligible.length){notify('No eligible portal customers. Onboard a customer first.');return;}showModal('Choose portal customer',selectField('Customer *','customer',eligible.map(customer=>({value:customer.id,label:customer.name})),eligible[0].id),data=>{state.customer=data.get('customer');closeModal();linkModal(button.dataset.orgId);});}if(action==='invite')inviteModal();if(['sample-accept','resend','revoke','deactivate','reactivate'].includes(action))userAction(action,button.dataset.userId);if(action==='suspend'){const customer=getCustomer();reasonModal(customer.status==='Suspended'?'Reactivate customer':'Suspend customer',customer.status==='Suspended'?'Restore eligible portal access for this customer.':'Block portal access for this customer while retaining source data.',reason=>{customer.status=customer.status==='Suspended'?(customer.users.some(user=>user.role==='Customer Admin'&&user.status==='Active')&&customer.links.length?'Active':'Onboarding'):'Suspended';audit(customer,'Customer status changed',customer.status+' / '+reason);notify('Sample customer status updated.');});}if(action==='policy'){const customer=getCustomer();showModal('Review sample publication policy',selectField('Priced-offer publication','publication',['CW1-confirmed','Direct'],customer.policy)+'<label for="policy-reason">Reason *</label><textarea id="policy-reason" name="reason" required maxlength="500"></textarea><div class="note">Sample customer override. Internal approval remains required. No quote or CW1 job is created.</div>',data=>{const before=customer.policy;customer.policy=data.get('publication');audit(customer,'Sample policy changed',before+' to '+customer.policy+' / '+data.get('reason'));closeModal();render();notify('Sample policy updated.');});}});
document.addEventListener('input',event=>{if(event.target.dataset.search){state.query=event.target.value;document.querySelector('#results').innerHTML=event.target.dataset.search==='customers'?customerRows():orgRows();}});
document.addEventListener('change',event=>{if(event.target.dataset.filter==='org'){state.status=event.target.value;document.querySelector('#results').innerHTML=orgRows();}});
document.addEventListener('submit',event=>{if(event.target.id==='wizard-form'){event.preventDefault();submitWizard();}});
document.querySelector('#menu').addEventListener('click',()=>{const open=document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#menu').setAttribute('aria-expanded',String(open));});
render();
</script>
</body>
</html>
